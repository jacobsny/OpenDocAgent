[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opendocagent"
version = "0.1.0"
description = "Agentic workflow tool for converting Markdown to LaTeX, PDF, PPTX, and DOCX."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "OpenDocAgent Contributors" }
]
requires-python = ">=3.12"
dependencies = [
    "markdown-it-py>=3.0.0",
    "pypandoc>=1.13",
    "python-pptx>=1.0.2",
    "python-docx>=1.1.2",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.3",
    "pygments>=2.17.2"
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.2.0"
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mcp>=1.2.0",
    "mypy>=1.10.0"
]

[project.scripts]
opendoc = "opendocagent.cli:main"

